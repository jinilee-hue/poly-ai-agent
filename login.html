<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | Poly AI Agent</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', 'Pretendard', -apple-system, sans-serif;
      background: linear-gradient(-45deg, #dbeafe, #c7d7ff, #ddd6fe, #bfdbfe, #ede9fe, #e0e7ff);
      background-size: 400% 400%;
      animation: gradientFlow 12s ease infinite;
      position: relative;
      overflow: hidden;
      padding: 24px;
    }
    @keyframes gradientFlow {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .orb { position: absolute; border-radius: 50%; filter: blur(70px); pointer-events: none; will-change: transform; }
    .orb-1 { width: 520px; height: 520px; background: radial-gradient(circle, rgba(99,102,241,0.4), transparent); top: -160px; left: -100px; animation: float1 18s ease-in-out infinite; }
    .orb-2 { width: 420px; height: 420px; background: radial-gradient(circle, rgba(59,130,246,0.35), transparent); bottom: -120px; right: -80px; animation: float2 14s ease-in-out infinite; }
    .orb-3 { width: 300px; height: 300px; background: radial-gradient(circle, rgba(167,139,250,0.3), transparent); top: 50%; left: 60%; transform: translate(-50%, -50%); animation: float3 20s ease-in-out infinite; }
    @keyframes float1 { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(40px,30px) scale(1.08)} 66%{transform:translate(-20px,50px) scale(0.95)} }
    @keyframes float2 { 0%,100%{transform:translate(0,0) scale(1)} 40%{transform:translate(-50px,-30px) scale(1.1)} 70%{transform:translate(20px,-50px) scale(0.92)} }
    @keyframes float3 { 0%,100%{transform:translate(-50%,-50%) scale(1)} 30%{transform:translate(-40%,-60%) scale(1.15)} 60%{transform:translate(-60%,-40%) scale(0.9)} }

    /* ── 카드 ── */
    .auth-card {
      position: relative;
      z-index: 1;
      display: flex;
      width: 860px;
      max-width: 100%;
      min-height: 540px;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.13), 0 4px 16px rgba(0,0,0,0.06);
      overflow: hidden;
    }

    /* ── 왼쪽 패널 ── */
    .auth-left {
      width: 380px;
      flex-shrink: 0;
      overflow: visible;
      position: relative;
      z-index: 2;
      background: linear-gradient(145deg, rgba(0,80,220,0.75) 0%, rgba(0,102,255,0.62) 55%, rgba(70,140,255,0.55) 100%);
      backdrop-filter: blur(4px);
      padding: 44px 40px;
      display: flex;
      flex-direction: column;
    }

    /* 왼쪽 패널 배경 오브 */
    .auth-left::before {
      content: '';
      position: absolute;
      width: 260px; height: 260px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      top: -80px; right: -80px;
    }
    .auth-left::after {
      content: '';
      position: absolute;
      width: 180px; height: 180px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      bottom: -60px; left: -40px;
    }

    .left-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: auto;
    }
    .left-logo img {
      height: 26px;
      filter: brightness(0) invert(1);
    }

    /* 로그인 그래픽 이미지 */
    .login-graphic {
      flex: 1;
      min-height: 0;
      margin: 0 -100px 0 -40px;
    }
    .login-graphic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    } 50%{transform:rotate(12deg) translateY(-8px)} }

    .left-title {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      line-height: 1.35;
      margin-bottom: 10px;
      letter-spacing: -0.3px;
    }
    .left-sub {
      font-size: 13.5px;
      color: rgba(255,255,255,0.72);
      line-height: 1.6;
    }

    /* ── 오른쪽 패널 ── */
    .auth-right {
      flex: 1;
      padding: 52px 48px 44px;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
      justify-content: center;
    }

    .form-title {
      font-size: 26px;
      font-weight: 700;
      color: #111827;
      letter-spacing: -0.4px;
      margin-bottom: 28px;
    }

    /* 소셜 버튼 */
    .social-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .btn-social {
      flex: 1;
      height: 42px;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      background: #fff;
      font-size: 13px;
      font-weight: 500;
      color: #374151;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-social:hover { background: #f9fafb; border-color: #d1d5db; }
    .btn-social svg { width: 17px; height: 17px; flex-shrink: 0; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      font-size: 12px;
      color: #9ca3af;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }

    /* 폼 */
    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 6px; }
    .input-wrap { position: relative; }
    .form-input {
      width: 100%;
      height: 44px;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      padding: 0 14px;
      font-size: 14px;
      color: #111827;
      background: #f9fafb;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .form-input::placeholder { color: #9ca3af; }
    .form-input:focus {
      border-color: #0066FF;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(0,102,255,0.1);
    }
    .pw-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; padding: 4px;
      color: #9ca3af; display: flex; align-items: center;
    }
    .pw-toggle:hover { color: #6b7280; }
    .pw-toggle svg { width: 17px; height: 17px; }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
      margin-top: 4px;
    }
    .remember-label {
      display: flex; align-items: center; gap: 7px;
      font-size: 13px; color: #6b7280; cursor: pointer; user-select: none;
    }
    .remember-label input { width: 14px; height: 14px; accent-color: #0066FF; cursor: pointer; }
    .forgot-link { font-size: 13px; color: #0066FF; text-decoration: none; font-weight: 500; }
    .forgot-link:hover { text-decoration: underline; }

    .btn-primary {
      width: 100%;
      height: 46px;
      background: linear-gradient(135deg, #0044cc, #0066FF);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, box-shadow 0.15s;
      margin-bottom: 16px;
      letter-spacing: -0.1px;
    }
    .btn-primary:hover { opacity: 0.92; box-shadow: 0 4px 16px rgba(0,102,255,0.35); }

    .auth-footer { text-align: center; font-size: 13px; color: #9ca3af; }
    .auth-footer a { color: #0066FF; font-weight: 500; text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }

    .form-error { font-size: 12px; color: #ef4444; margin-top: 4px; display: none; }
  </style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="auth-card">

  <!-- 왼쪽 -->
  <div class="auth-left">
    <div class="left-logo">
      <img src="https://www.polyinspiration.com/img/main/logo.png" alt="POLY">
    </div>

    <div class="login-graphic">
      <img src="images/login-graphic.png" alt="">
    </div>

    <div class="left-title">데이터로 만드는<br>경영 인사이트</div>
    <div class="left-sub">Poly AI Agent와 함께<br>스마트한 경영 분석을 시작하세요.</div>
  </div>

  <!-- 오른쪽 -->
  <div class="auth-right">
    <div class="form-title">Sign in</div>

    <div class="social-row">
      <button class="btn-social" onclick="window.location.href='home.html'">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        구글로 로그인
      </button>
    </div>

    <div class="divider">OR</div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">아이디</label>
        <input class="form-input" type="text" id="username" placeholder="아이디를 입력하세요" autocomplete="username">
        <div class="form-error" id="userError">아이디를 입력해주세요.</div>
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <div class="input-wrap">
          <input class="form-input" type="password" id="password" placeholder="비밀번호를 입력하세요" style="padding-right:40px" autocomplete="current-password">
          <button type="button" class="pw-toggle" onclick="togglePw()">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="form-error" id="pwError">비밀번호를 입력해주세요.</div>
      </div>
      <div class="form-options">
        <label class="remember-label"><input type="checkbox"> 로그인 유지</label>
        <a href="#" class="forgot-link">비밀번호 찾기</a>
      </div>
      <button type="submit" class="btn-primary">로그인</button>
    </form>

    <div class="auth-footer">
      계정이 없으신가요? <a href="signup.html">회원가입</a>
    </div>
  </div>

</div>

<script>
  function togglePw() {
    const pw = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    const hidden = pw.type === 'password';
    pw.type = hidden ? 'text' : 'password';
    icon.innerHTML = hidden
      ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
  function handleLogin(e) {
    e.preventDefault();
    let valid = true;
    document.getElementById('userError').style.display = 'none';
    document.getElementById('pwError').style.display   = 'none';
    if (!document.getElementById('username').value.trim()) { document.getElementById('userError').style.display = 'block'; valid = false; }
    if (!document.getElementById('password').value)        { document.getElementById('pwError').style.display   = 'block'; valid = false; }
    if (valid) window.location.href = 'home.html';
  }
</script>
</body>
</html>
