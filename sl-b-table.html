    .sl-bar { height:4px; background:var(--color-bg-muted); border-radius:2px; overflow:hidden; margin-bottom:4px; }
    .sl-bar-fill { height:100%; background:var(--color-primary); border-radius:2px; }

    .sl-seg-m { color:var(--color-primary); font-weight:var(--weight-medium); }

    .sl-students { flex:1; }
    .sl-row { display:flex; align-items:center; gap:6px; padding:6px var(--space-3); border-bottom:1px solid var(--color-border); }
    .sl-row:last-child { border-bottom:none; }
    .sl-idx { font-size:11px; color:var(--color-text-tertiary); width:14px; text-align:right; flex-shrink:0; }
    .sl-type { width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:var(--weight-bold); flex-shrink:0; }
    .sl-type-yu { background:var(--color-primary-light,#E8F0FF); color:var(--color-primary); }
    .sl-type-jin { background:var(--color-primary); color:#fff; }
    .sl-names { flex:1; min-width:0; }
    .sl-ko { font-size:var(--text-xs); font-weight:var(--weight-medium); color:var(--color-text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .sl-en { font-size:9px; color:var(--color-text-tertiary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .sl-meta { display:flex; flex-direction:column; align-items:flex-end; gap:2px; flex-shrink:0; }
    .sl-g-m { font-size:11px; color:var(--color-primary); font-weight:var(--weight-medium); }
    .sl-g-f { font-size:11px; color:var(--color-text-secondary); }
    .sl-fam { font-size:9px; padding:1px 5px; border-radius:var(--radius-sm); background:var(--color-primary); color:#fff; }

    .sl-vacant { display:flex; align-items:center; gap:6px; padding:5px var(--space-3); border-bottom:1px solid var(--color-border); opacity:0.4; }
    .sl-vacant:last-child { border-bottom:none; }
    .sl-vacant-idx { font-size:11px; color:var(--color-text-tertiary); width:14px; text-align:right; }
    .sl-vacant-txt { font-size:var(--text-xs); color:var(--color-text-tertiary); }

    .sl-wait { padding:var(--space-2) var(--space-3); border-top:var(--border-default); font-size:11px; color:var(--color-text-tertiary); text-align:center; background:var(--color-bg-muted); }

    .sl-null-card { flex:0 0 80px; background:var(--color-bg-muted); border:var(--border-default); border-radius:var(--radius-lg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-height:200px; }
    .sl-null-room { font-size:var(--text-xs); font-weight:var(--weight-medium); color:var(--color-text-secondary); }
    .sl-null-sub { font-size:9px; color:var(--color-text-tertiary); }
  </style>
</head>

BRAND_TOKENS.all=BRAND_TOKENS.poly;

function applyBrand(b){
  var t=BRAND_TOKENS[b]||BRAND_TOKENS.poly;
  Object.keys(t).forEach(function(k){document.documentElement.style.setProperty(k,t[k]);});
  document.documentElement.setAttribute('data-brand',b);
}

function _syncTheme(){
  var dark=document.documentElement.getAttribute('data-theme')==='dark';
  var btn=document.getElementById('theme-toggle-2');
  if(!btn)return;
  btn.innerHTML=dark?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
}
document.getElementById('theme-toggle-2').addEventListener('click',function(){
  var dark=document.documentElement.getAttribute('data-theme')==='dark';
  var next=dark?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('epTheme',next);
  _syncTheme();
  applyBrand(localStorage.getItem('polyBrand')||'poly');
  window.dispatchEvent(new CustomEvent('themechange'));
});
_syncTheme();

function toggleCond(id){
  var m=document.getElementById(id+'CondMenu');
  var c=document.getElementById(id+'CondChevron');
  if(!m)return;
  m.classList.toggle('open');
  if(c)c.style.transform=m.classList.contains('open')?'rotate(180deg)':'';
}
function pickCond(id,label,btn){
  document.getElementById(id+'CondLabel').textContent=label;
  document.querySelectorAll('#'+id+'CondMenu .cond-item').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById(id+'CondMenu').classList.remove('open');
  var c=document.getElementById(id+'CondChevron');
  if(c)c.style.transform='';
}
document.addEventListener('click',function(e){
  document.querySelectorAll('.cond-wrap').forEach(function(w){
    if(!w.contains(e.target)){
      var m=w.querySelector('.cond-menu');
      if(m)m.classList.remove('open');
      var c=w.querySelector('.cond-trigger svg');
      if(c)c.style.transform='';
    }
  });
});

document.querySelectorAll('.lnb-brand-btn').forEach(function(btn){
  var saved=localStorage.getItem('polyBrand')||'poly';
  btn.classList.toggle('active',btn.dataset.brand===saved);
  btn.addEventListener('click',function(){
    document.querySelectorAll('.lnb-brand-btn').forEach(function(b){b.classList.remove('active');});
    this.classList.add('active');
    localStorage.setItem('polyBrand',this.dataset.brand);
    applyBrand(this.dataset.brand);
  });
});
applyBrand(localStorage.getItem('polyBrand')||'poly');

var curBlockIdx=0, curDayIdx=0;

function buildDayTabs(){
  var tabs=document.getElementById('dayTabs');
  var days=BLOCKS[curBlockIdx].days;
  var html=BLOCKS.map(function(b,bi){
    return '<button class="sl-day-tab'+(bi===curBlockIdx?' active':'')+'" onclick="setBlock('+bi+')">'+b.label+'</button>';
  }).join('');
  if(days.length>1){
    html+='<span class="sl-day-divider"></span>';
    html+=days.map(function(d,di){
      return '<button class="sl-day-tab'+(di===curDayIdx?' active':'')+'" onclick="setDay('+di+')">'+d.day+'</button>';
    }).join('');
  }
  tabs.innerHTML=html;
}

function renderCard(rd, roomName){
  if(!rd) return '<div class="sl-null-card"><span class="sl-null-room">'+roomName+'</span><span class="sl-null-sub">수업 없음</span></div>';
  var enr=rd.students.length, cap=rd.cap, rem=cap-enr;
  var pct=Math.round(enr/cap*100);
  var lowPct=pct<60;
  var mc=0; rd.students.forEach(function(s){if(s.g==='남')mc++;});
  var fc=enr-mc;
  var badgeCls='badge-success', badgeTxt='TO '+rem;
  if(enr>=cap){badgeCls='badge-neutral';badgeTxt='마감';}
  else if(pct<60){badgeCls='badge-warning';}
  var rows=rd.students.map(function(s,i){
    return '<div class="sl-row">'
      +'<span class="sl-idx">'+(i+1)+'</span>'
      +'<span class="sl-type sl-type-'+s.type+'">'+s.type+'</span>'
      +'<div class="sl-names"><div class="sl-ko">'+s.n+'</div><div class="sl-en">'+s.en+'</div></div>'
      +'<div class="sl-meta"><span class="'+(s.g==='남'?'sl-g-m':'sl-g-f')+'">'+s.g+'</span>'+(s.fam?'<span class="sl-fam">가족</span>':'')+'</div>'
      +'</div>';
  }).join('');
  var vacants='';
  for(var i=0;i<rem;i++){
    vacants+='<div class="sl-vacant"><span class="sl-vacant-idx">'+(enr+i+1)+'</span><span class="sl-vacant-txt">공석</span></div>';
  }
  return '<div class="sl-card">'
    +'<div class="sl-card-head">'
    +'<div class="sl-head-row1"><span class="sl-room-title">'+rd.level+'-'+rd.room+'</span><button class="sl-teacher-btn">담당교사</button></div>'
    +'<div class="sl-head-row2"><span class="sl-pct'+(lowPct?' low':'')+'">'+pct+'<span style="font-size:13px;font-weight:400;">%</span></span>'
    +'<div style="display:flex;gap:4px;align-items:center;"><span style="font-size:11px;color:var(--color-text-tertiary);">'+enr+'/'+cap+'명</span><span class="badge '+badgeCls+'" style="font-size:11px;">'+badgeTxt+'</span></div></div>'
    +'<div class="sl-bar"><div class="sl-bar-fill" style="width:'+pct+'%"></div></div>'
    +'<div class="sl-seg-info"><span class="sl-seg-m">남 '+mc+'</span><span>여 '+fc+'</span></div>'
    +'</div>'
    +'<div class="sl-students">'+rows+vacants+'</div>'
    +'<div class="sl-wait">대기생 없음</div>'
    +'</div>';
}

function renderGrid(){
  var day=BLOCKS[curBlockIdx].days[curDayIdx];
  var html='';
  for(var i=0;i<ROOMS.length;i++){
    html+=renderCard(day.rooms[i],ROOMS[i]);
  }
  document.getElementById('slGrid').innerHTML=html;
}

function setBlock(bi){
  curBlockIdx=bi; curDayIdx=0;
  buildDayTabs(); renderGrid();
}
function setDay(di){
  curDayIdx=di; buildDayTabs(); renderGrid();
}

buildDayTabs();
renderGrid();
