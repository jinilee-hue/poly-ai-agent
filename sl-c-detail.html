var curBlockIdx=0, curDayIdx=0, selKey=null;

function buildBlockTabs(){
  document.getElementById('blockTabs').innerHTML=BLOCKS.map(function(b,i){
    return '<button class="cc-tab'+(i===curBlockIdx?' active':'')+'" onclick="setBlock('+i+')">'+b.label+'</button>';
  }).join('');
}

function buildDayTabs(){
  var days=BLOCKS[curBlockIdx].days;
  var wrap=document.getElementById('dayTabsWrap');
  if(days.length<=1){wrap.style.display='none';return;}
  wrap.style.display='flex';
  wrap.innerHTML=days.map(function(d,i){
    return '<button class="sl-day-tab-sm'+(i===curDayIdx?' active':'')+'" onclick="setDay('+i+')">'+d.day+'</button>';
  }).join('');
}

function buildMaster(){
  buildBlockTabs(); buildDayTabs();
  var day=BLOCKS[curBlockIdx].days[curDayIdx];
  var active=0;
  var html=ROOMS.map(function(rn,ri){
    var rd=day.rooms[ri];
    if(!rd) return '<div class="sl-room-tile sl-null-tile"><div class="sl-tile-top"><span class="sl-tile-name">'+rn+'</span></div><div style="font-size:11px;color:var(--color-text-tertiary);">수업 없음</div></div>';
    var enr=rd.students.length, cap=rd.cap, pct=Math.round(enr/cap*100), low=pct<60;
    var key=curBlockIdx+'|'+curDayIdx+'|'+ri;
    active++;
    var bt=enr>=cap?'마감':'TO '+(cap-enr);
    var bc=enr>=cap?'badge-neutral':low?'badge-warning':'badge-success';
    return '<div class="sl-room-tile'+(low?' low-fill':'')+(selKey===key?' active':'')+'" onclick="selectRoom('+curBlockIdx+','+curDayIdx+','+ri+')">'
      +'<div class="sl-tile-top"><span class="sl-tile-name">'+rd.level+'-'+rn+'</span><span class="sl-tile-pct'+(low?' low':'')+'">'+pct+'%</span></div>'
      +'<div class="sl-tile-bar"><div class="sl-tile-fill'+(low?' low':'')+'" style="width:'+pct+'%"></div></div>'
      +'<div style="display:flex;align-items:center;justify-content:space-between;"><span class="sl-tile-meta">'+enr+'/'+cap+'명</span><span class="badge '+bc+'" style="font-size:9px;">'+bt+'</span></div>'
      +'</div>';
  }).join('');
  document.getElementById('roomGrid').innerHTML=html;
  document.getElementById('masterCount').textContent=active+'개 강의실';
}

function selectRoom(bi,di,ri){
  selKey=bi+'|'+di+'|'+ri;
  buildMaster();
  var block=BLOCKS[bi], day=block.days[di], rd=day.rooms[ri];
  if(!rd){document.getElementById('detailCard').innerHTML='<div class="sl-placeholder"><p>수업 없는 강의실입니다</p></div>';return;}
  var enr=rd.students.length, cap=rd.cap, pct=Math.round(enr/cap*100), rem=cap-enr;
  var mc=0; rd.students.forEach(function(s){if(s.g==='남')mc++;});
  var fc=enr-mc;
  var fam=rd.students.filter(function(s){return s.fam;}).length;
  var low=pct<60;
  var bt=enr>=cap?'마감':'TO '+rem, bc=enr>=cap?'badge-neutral':low?'badge-warning':'badge-success';
  var rows=rd.students.map(function(s,i){
    return '<tr><td><span class="sl-idx-num">'+(i+1)+'</span></td><td><span class="sl-type-badge sl-type-'+s.type+'">'+s.type+'</span></td><td><div class="sl-name-ko">'+s.n+'</div><div class="sl-name-en">'+s.en+'</div></td><td><span class="'+(s.g==='남'?'sl-g-m':'sl-g-f')+'">'+s.g+'</span></td><td style="font-size:var(--text-xs);color:var(--color-text-secondary);">'+s.start+'</td><td>'+(s.fam?'<span class="badge badge-success" style="font-size:11px;">가족</span>':'')+'</td></tr>';
  }).join('');
  var vacants='';
  for(var i=0;i<rem;i++){
    vacants+='<tr class="vacant-row"><td><span class="sl-idx-num">'+(enr+i+1)+'</span></td><td></td><td style="color:var(--color-text-tertiary);font-style:italic;font-size:var(--text-xs);">공석</td><td></td><td></td><td></td></tr>';
  }
  document.getElementById('detailCard').innerHTML='<div class="sl-detail-head">'
    +'<div class="sl-detail-title-row"><span class="sl-detail-room-name">'+rd.level+'-'+rd.room+'</span><span class="badge '+bc+'">'+bt+'</span><span class="sl-detail-sub">'+block.label+' · '+day.day+'</span><button class="teacher-btn-sm">담당교사</button></div>'
    +'<div class="sl-detail-kpi"><div class="sl-kpi-item"><span class="sl-kpi-label">재원</span><span class="sl-kpi-value primary">'+enr+'<span class="sl-kpi-unit">명</span></span></div><div class="sl-kpi-item"><span class="sl-kpi-label">정원</span><span class="sl-kpi-value">'+cap+'<span class="sl-kpi-unit">명</span></span></div><div class="sl-kpi-item"><span class="sl-kpi-label">여석</span><span class="sl-kpi-value'+(low?' warning':'')+'">'+rem+'<span class="sl-kpi-unit">석</span></span></div><div class="sl-kpi-item"><span class="sl-kpi-label">가동률</span><span class="sl-kpi-value'+(low?' warning':'')+'">'+pct+'<span class="sl-kpi-unit">%</span></span></div><div class="sl-kpi-item"><span class="sl-kpi-label">가족할인</span><span class="sl-kpi-value">'+fam+'<span class="sl-kpi-unit">명</span></span></div></div>'
    +'<div class="sl-seg-row"><span class="sl-seg-label">남 '+mc+' · 여 '+fc+'</span><div class="sl-seg-track"><div class="sl-seg-m-fill" style="flex:'+mc+'"></div><div class="sl-seg-f-fill" style="flex:'+fc+'"></div></div></div>'
    +'</div>'
    +'<table class="sl-detail-table"><thead><tr><th style="width:36px;">#</th><th style="width:24px;">구분</th><th>이름</th><th style="width:40px;">성별</th><th style="width:80px;">입학</th><th style="width:60px;">가족</th></tr></thead>'
    +'<tbody>'+rows+vacants+'<tr><td colspan="6" style="text-align:center;padding:var(--space-3);font-size:var(--text-xs);color:var(--color-text-tertiary);">대기생 없음</td></tr></tbody></table>';
}

function setBlock(i){curBlockIdx=i;curDayIdx=0;selKey=null;buildMaster();document.getElementById('detailCard').innerHTML='<div class="sl-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="M14 12h.01"/></svg><p>강의실을 선택하세요</p></div>';}
function setDay(i){curDayIdx=i;selKey=null;buildMaster();}

buildMaster();
</script>
